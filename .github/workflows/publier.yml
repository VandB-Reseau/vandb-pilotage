name: Publier la page de renvoi

# Ce dépôt n'est plus qu'une page de renvoi : l'ancienne adresse https://vandb-reseau.github.io/vandb-pilotage/
# mène à la même page dans l'app réseau (dépôt VandB-Reseau/vandb-reseau). Rien à tester ni à construire.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publier:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploiement
        uses: actions/deploy-pages@v4
